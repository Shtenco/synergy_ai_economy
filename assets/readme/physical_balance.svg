<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="690px" version="1.1" viewBox="0 0 1400 690" width="1400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0b1626" height="690" width="1400" x="0" y="0" /><text fill="#f2f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="bold" opacity="1" text-anchor="start" x="60" y="71">ФИЗИЧЕСКАЯ ЭКОНОМИКА • БАЛАНС</text><text fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" opacity="1" text-anchor="start" x="60" y="109">Производство возможно только при наличии промежуточных ресурсов и мощностей</text><rect fill="#17334b" height="94" rx="18" ry="18" stroke="none" stroke-width="1.2" width="1260" x="65" y="156" /><text fill="#f2f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" opacity="1" text-anchor="start" x="96" y="193">Начальный запас + выпуск + импорт</text><text fill="#afdcd8" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" opacity="1" text-anchor="start" x="98" y="226">Ресурсы в наличии</text><rect fill="#17334b" height="94" rx="18" ry="18" stroke="none" stroke-width="1.2" width="1260" x="65" y="272" /><text fill="#f2f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" opacity="1" text-anchor="start" x="96" y="309">Промежуточные поставки + потребление</text><text fill="#afdcd8" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" opacity="1" text-anchor="start" x="98" y="342">Физический спрос</text><rect fill="#17334b" height="94" rx="18" ry="18" stroke="none" stroke-width="1.2" width="1260" x="65" y="388" /><text fill="#f2f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" opacity="1" text-anchor="start" x="96" y="425">Инвестиции + экспорт + конечный остаток</text><text fill="#afdcd8" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" opacity="1" text-anchor="start" x="98" y="458">Итоговое распределение</text><rect fill="#0b534f" height="77" rx="15" ry="15" stroke="none" stroke-width="1.2" width="1260" x="65" y="544" /><text fill="#dcfff5" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" opacity="1" text-anchor="middle" x="695" y="591">Эмиссия или новая кредитная запись не создают физический товар на складе.</text><text fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" opacity="1" text-anchor="start" x="54" y="650">СИНЕРГИЯ • ИССЛЕДОВАТЕЛЬСКАЯ МОДЕЛЬ • НЕ ПРОГНОЗ ЭКОНОМИКИ</text><text fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" opacity="1" text-anchor="end" x="1346" y="650">Соблюдение уравнений не заменяет эмпирическую калибровку</text></svg>