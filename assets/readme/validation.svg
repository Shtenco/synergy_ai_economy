<svg baseProfile="full" height="650px" version="1.1" viewBox="0 0 1400 650" width="1400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0b1626" height="650" width="1400" x="0" y="0" /><text fill="#f2f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="bold" opacity="1" text-anchor="start" x="60" y="71">ПРОВЕРКА ПРОТИВ ДАННЫХ РОССИИ</text><text fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" opacity="1" text-anchor="start" x="60" y="109">Средняя абсолютная ошибка, 2023–2025 • процентные пункты</text><rect fill="#14283e" height="414" rx="20" ry="20" stroke="none" stroke-width="1.2" width="1270" x="60" y="150" /><text fill="#f2f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" opacity="1" text-anchor="start" x="86" y="197">Независимая модельная проверка не пройдена</text><text fill="#d9e6ef" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" opacity="1" text-anchor="start" x="87" y="265.0">Рост, нормальные условия</text><rect fill="#263953" height="23" rx="7" ry="7" stroke="none" stroke-width="1.2" width="1004" x="278" y="245.0" /><rect fill="#3785f7" height="23" rx="7" ry="7" stroke="none" stroke-width="1.2" width="491.5837837837838" x="278" y="245.0" /><text fill="#f2f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" opacity="1" text-anchor="start" x="779.5837837837838" y="264.0">4.57 п.п.</text><text fill="#d9e6ef" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" opacity="1" text-anchor="start" x="87" y="332.25">Инфляция, нормальные условия</text><rect fill="#263953" height="23" rx="7" ry="7" stroke="none" stroke-width="1.2" width="1004" x="278" y="312.25" /><rect fill="#e3a34e" height="23" rx="7" ry="7" stroke="none" stroke-width="1.2" width="995.0" x="278" y="312.25" /><text fill="#f2f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" opacity="1" text-anchor="end" x="1305" y="331.25">9.25 п.п.</text><text fill="#d9e6ef" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" opacity="1" text-anchor="start" x="87" y="399.5">Рост, стресс</text><rect fill="#263953" height="23" rx="7" ry="7" stroke="none" stroke-width="1.2" width="1004" x="278" y="379.5" /><rect fill="#18b7a3" height="23" rx="7" ry="7" stroke="none" stroke-width="1.2" width="374.33513513513515" x="278" y="379.5" /><text fill="#f2f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" opacity="1" text-anchor="start" x="662.3351351351351" y="398.5">3.48 п.п.</text><text fill="#d9e6ef" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" opacity="1" text-anchor="start" x="87" y="466.75">Инфляция, стресс</text><rect fill="#263953" height="23" rx="7" ry="7" stroke="none" stroke-width="1.2" width="1004" x="278" y="446.75" /><rect fill="#ad83df" height="23" rx="7" ry="7" stroke="none" stroke-width="1.2" width="853.0108108108109" x="278" y="446.75" /><text fill="#f2f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" opacity="1" text-anchor="start" x="1141.0108108108109" y="465.75">7.93 п.п.</text><text fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" opacity="1" text-anchor="start" x="85" y="543">Сравниваются модельная ВДС и наблюдаемый реальный ВВП — это разные агрегаты.</text><text fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" opacity="1" text-anchor="start" x="54" y="610">СИНЕРГИЯ • ИССЛЕДОВАТЕЛЬСКАЯ МОДЕЛЬ • НЕ ПРОГНОЗ ЭКОНОМИКИ</text><text fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" opacity="1" text-anchor="end" x="1346" y="610">Не использовать модель как макроэкономический прогноз</text></svg>